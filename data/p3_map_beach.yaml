debug_physics: false # si se muestra el debug de la física
width: 15
time: 180000
exit_time: 3000 # El tiempo que se queda luego de atrapar al ladrón o perder
music:
  loop:
    sound: sounds/p3_music_full.ogg
    volume: 0.6
    loop_start: 5.121
  win:
    sound: sounds/p3_music_win.ogg
    volume: 0.6
  lose:
    sound: sounds/p3_music_lose.ogg
    volume: 0.6
  start:
    sound: sounds/p3_music_intro.ogg
    volume: 0.6
#
#
#FONDO (lo primero es lo de mas atrás)
#
sky: 
  color : 232442 # Es el color de fondo
  backgrounds:
    night:
      texture : images/p3_back_night.jpg
      speed : 120
    noon:
      texture : images/p3_back_day.jpg
      speed : 120
    afternoon:
      texture : images/p3_back_dusk.jpg
      speed : 120
  layers : 
  - texture : images/p3_horz_seaside.gif
    speed : 200
#
#
#
#TERRENO!
terrain:
- texture: 
    image: images/p3_floor_beach_002_a.jpg
    w: 86
    h: 10
  length: 100000
  materials:
    left:
    - from: 8
      to: 15
      animation:
      - texture: images/p3_fx_sand_001.gif
        duration: 41
      - texture: images/p3_fx_sand_002.gif
        duration: 41
      - texture: images/p3_fx_sand_003.gif
        duration: 41
      sound_effect: sounds/p3_car_rough_terrain.wav
      rolling_resistance: 300 
    - from: 15
      to: 50
      animation:
      - texture: images/p3_fx_grass_001.gif
        duration: 41
      - texture: images/p3_fx_grass_002.gif
        duration: 41
      - texture: images/p3_fx_grass_003.gif
        duration: 41
      sound_effect: sounds/p3_car_rough_terrain.wav
      rolling_resistance: 300 
    right:
    - from: 8
      to: 50
      animation:
      - texture: images/p3_fx_sand_001.gif
        duration: 41
      - texture: images/p3_fx_sand_002.gif
        duration: 41
      - texture: images/p3_fx_sand_003.gif
        duration: 41
      sound_effect: sounds/p3_car_rough_terrain.wav
      rolling_resistance: 300 
  left_fill: 5f9e43
  right_fill: 366ce8
#
#
#PUNTOS DONDE APARECE EL TRAFICO
#
lanes: [3.5, -3.5]
