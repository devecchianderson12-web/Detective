finishing:
  deacceleration: 100 # La aceleración del frenado cuando el auto está al lado del ladrón
  maneuver_time: 0.28 # Tiempo que demora en cerrar al ladrón
  close_distance: 3.5 # La distancia a la que el auto se acerca al ladrón antes de frenar
  maneuver_speed: 18 # La velocidad que lleva el auto cuando para cerrar al ladrón
  maneuver_front_distance: 3 # Que tan adelante queda del ladrón al cerrarlo
  maneuver_side_distance: 1.5 # Que tan alejado va a quedar el auto del centro del auto del ladrón al cerrarlo

