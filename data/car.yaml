width: 3.0
acceleration :
  #gears : [20.5, 5, 2.3, 1.7]
  gears : [18, 7, 3.5, 2.1]
  power : 14
  #power : 12.4
drag: 0.9
#drag : 1.7
#rolling_resistance : 85
rolling_resistance: 85
restitution: 0.5 # Define que tan elásticas son las colisiones, de 0 a 1, en 0 se quedan pegadas, 
               # en 1 rebotan con la misma velocidad con la que venían
tyres: # Define la posición de las ruedas con respecto al centro del auto
  left: 1.5 # Es cuánto a la izquierda se encuentra la rueda izquierda
  right: 1.5 # Lo mismo con la derecha
length: 8
mass : 2000
break : 150
cornering :
  slow: 0.55
  fast: 0.48
  speed: 4.5
extra_resistance : 30
max_rpm: 300

min_material_effect_speed: 20 # A qué velocidad deja de actuar el efecto del material

max_wheels_speed: 100 # A qué velocidad las ruedas quedan en su velocidad máxima de giro
max_cornering_speed: 100 # Hasta esta velocidad se limita como se muestra lo que dobla el auto

