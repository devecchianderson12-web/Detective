name: Build APK

# Cada push a main compila el APK (python-for-android) y reemplaza el release "latest".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Cache de buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar APK
        run: |
          # siempre la misma firma: así cada APK nuevo se instala encima del anterior
          mkdir -p ~/.android
          cp .github/keystore/debug.keystore ~/.android/debug.keystore
          yes | buildozer android debug
          cp bin/*.apk "$GITHUB_WORKSPACE/Detective.apk"

      - name: Actualizar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest Detective.apk \
            --title "Detective build ${{ github.run_number }}" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest
